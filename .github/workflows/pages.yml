name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo para todos os jobs; só o job que publica recebe pages/id-token.
permissions:
  contents: read

# Um grupo por ref: uma execução de PR nunca cancela a publicação da main.
# Só se cancela a execução anterior de refs que não são a main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sem scripts de instalação: nenhuma dependência do build precisa deles (só o fsevents, do macOS, tem).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          # O endereço publicado (README, "Mudar para o domínio próprio"): a variável do repositório
          # VITE_ENDERECO, em Settings → Secrets and variables → Actions → Variables. Vazia = o padrão
          # de src/app/endereco.ts (https://silasklein.github.io/iconodb-app/).
          VITE_ENDERECO: ${{ vars.VITE_ENDERECO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    # Só a main publica (nunca um PR nem um workflow_dispatch de outro ramo).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Aqui, e não no build: consultar o site do Pages pede a permissão "pages", que só este job tem.
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
